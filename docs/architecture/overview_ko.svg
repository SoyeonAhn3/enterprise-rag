<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 830" width="1160" height="830" font-family="Segoe UI, Malgun Gothic, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8B3A3A"/>
    </marker>
    <filter id="sh" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <style>
      .band{fill:#F8FAFC;stroke:#E2E8F0;stroke-width:1}
      .bandg{fill:#EEF2F7;stroke:#1E3A5F;stroke-width:1.5}
      .bt{font-size:12px;font-weight:600;fill:#64748B;letter-spacing:.3px}
      .btg{font-size:12px;font-weight:600;fill:#1E3A5F;letter-spacing:.3px}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1}
      .core{fill:#1E3A5F;stroke:#1E3A5F}
      .muted{fill:#F1F5F9;stroke:#CBD5E1;stroke-width:1}
      .t{font-size:15px;font-weight:600;fill:#1F2937;text-anchor:middle}
      .s{font-size:12px;fill:#64748B;text-anchor:middle}
      .tw{font-size:15px;font-weight:600;fill:#FFFFFF;text-anchor:middle}
      .sw{font-size:12px;fill:#CBD5E1;text-anchor:middle}
      .ln{fill:none;stroke:#64748B;stroke-width:1.4}
      .dl{fill:none;stroke:#64748B;stroke-width:1.4;stroke-dasharray:5 4}
      .rl{fill:none;stroke:#8B3A3A;stroke-width:2}
      .lb{font-size:12px;fill:#334155}
      .lbr{font-size:12px;font-weight:600;fill:#8B3A3A}
      .lbg{fill:#FFFFFF}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- 진입점 band -->
  <rect class="band" x="170" y="20" width="970" height="120" rx="8"/>
  <text class="bt" x="186" y="42">진입점 — 화면 · 명령줄</text>
  <rect class="card" filter="url(#sh)" x="200" y="58" width="260" height="62" rx="6"/>
  <text class="t" x="330" y="84">Streamlit 앱</text><text class="s" x="330" y="104">app · app_runtime · source_display</text>
  <rect class="card" filter="url(#sh)" x="860" y="58" width="260" height="62" rx="6"/>
  <text class="t" x="990" y="84">명령줄 도구</text><text class="s" x="990" y="104">ingest · deployment · eval/</text>

  <!-- 답변 파이프라인 band -->
  <rect class="bandg" x="170" y="180" width="970" height="240" rx="8"/>
  <text class="btg" x="186" y="202">답변 파이프라인 — 질문마다 실행</text>
  <rect class="core" filter="url(#sh)" x="200" y="218" width="260" height="62" rx="6"/>
  <text class="tw" x="330" y="244">검색 모듈</text><text class="sw" x="330" y="264">index_store · embeddings 외 1개</text>
  <rect class="core" filter="url(#sh)" x="530" y="218" width="260" height="62" rx="6"/>
  <text class="tw" x="660" y="244">rag.py</text><text class="sw" x="660" y="264">Retriever · RAGAssistant</text>
  <rect class="core" filter="url(#sh)" x="860" y="218" width="260" height="62" rx="6"/>
  <text class="tw" x="990" y="244">llm.py</text><text class="sw" x="990" y="264">ClaudeClient</text>
  <rect class="core" filter="url(#sh)" x="200" y="338" width="260" height="62" rx="6"/>
  <text class="tw" x="330" y="364">grounding.py</text><text class="sw" x="330" y="384">프롬프트 · 인용 검증</text>
  <rect class="card" filter="url(#sh)" x="530" y="338" width="260" height="62" rx="6"/>
  <text class="t" x="660" y="364">tracing.py</text><text class="s" x="660" y="384">LangSmith 기록 (선택)</text>

  <!-- 외부 서비스 band -->
  <rect class="band" x="170" y="460" width="970" height="120" rx="8"/>
  <text class="bt" x="186" y="482">외부 서비스</text>
  <rect class="muted" filter="url(#sh)" x="530" y="498" width="260" height="62" rx="6"/>
  <text class="t" x="660" y="524">LangSmith</text><text class="s" x="660" y="544">기본 꺼짐 · 켜면 추적 기록</text>
  <rect class="muted" filter="url(#sh)" x="860" y="498" width="260" height="62" rx="6"/>
  <text class="t" x="990" y="524">Claude API</text><text class="s" x="990" y="544">Messages API · JSON 스키마</text>

  <!-- 저장소 band -->
  <rect class="band" x="170" y="620" width="970" height="120" rx="8"/>
  <text class="bt" x="186" y="642">저장소 — 로컬 파일</text>
  <g filter="url(#sh)">
    <path d="M200,670 a130,12 0 0 1 260,0 v54 a130,12 0 0 1 -260,0 z" fill="#F1F5F9" stroke="#CBD5E1"/>
    <path d="M200,670 a130,12 0 0 0 260,0" fill="none" stroke="#CBD5E1"/>
  </g>
  <text class="t" x="330" y="704">documents/</text><text class="s" x="330" y="724">PDF 4개 · 고정 코퍼스</text>
  <g filter="url(#sh)">
    <path d="M530,670 a130,12 0 0 1 260,0 v54 a130,12 0 0 1 -260,0 z" fill="#F1F5F9" stroke="#CBD5E1"/>
    <path d="M530,670 a130,12 0 0 0 260,0" fill="none" stroke="#CBD5E1"/>
  </g>
  <text class="t" x="660" y="704">로컬 파일</text><text class="s" x="660" y="724">chroma_db · index_bundle 외 2개</text>

  <!-- 사용자 -->
  <rect x="20" y="59" width="120" height="60" rx="30" fill="#334155" filter="url(#sh)"/>
  <text class="tw" x="80" y="94">사용자</text>

  <!-- edges -->
  <!-- 질문 -->
  <path class="ln" d="M140,89 H198" marker-end="url(#ah)"/>
  <rect class="lbg" x="152" y="67" width="34" height="16"/><text class="lb" x="169" y="80" text-anchor="middle">질문</text>
  <!-- 시작 시 ensure_index -->
  <path class="ln" d="M460,89 H858" marker-end="url(#ah)"/>
  <text class="lb" x="660" y="81" text-anchor="middle">시작 시 ensure_index</text>
  <!-- RAGAssistant.answer() 묶음선 -->
  <path class="ln" d="M330,120 V160 H900 M900,120 V160"/>
  <path class="ln" d="M660,160 V216" marker-end="url(#ah)"/>
  <rect class="lbg" x="402" y="152" width="157" height="16"/><text class="lb" x="480" y="165" text-anchor="middle">RAGAssistant.answer()</text>
  <!-- AI 채점 -->
  <path class="ln" d="M1060,120 V216" marker-end="url(#ah)"/>
  <text class="lb" x="1068" y="165">AI 채점</text>
  <!-- 원문 단어 (표시용) -->
  <path class="dl" d="M230,120 V160 H155 V700 H198" marker-end="url(#ah)"/>
  <rect class="lbg" x="160" y="152" width="65" height="16"/><text class="lb" x="192" y="165" text-anchor="middle">원문 단어</text>
  <!-- 벡터 검색 -->
  <path class="ln" d="M530,249 H462" marker-end="url(#ah)"/>
  <text class="lb" x="495" y="241" text-anchor="middle">벡터 검색</text>
  <!-- generate -->
  <path class="ln" d="M790,249 H858" marker-end="url(#ah)"/>
  <text class="lb" x="825" y="241" text-anchor="middle">generate</text>
  <!-- 프롬프트 · 인용 검증 -->
  <path class="ln" d="M570,280 V309 H330 V336" marker-end="url(#ah)"/>
  <rect class="lbg" x="383" y="301" width="134" height="16"/><text class="lb" x="450" y="314" text-anchor="middle">프롬프트 · 인용 검증</text>
  <!-- 단계 기록 -->
  <path class="ln" d="M660,280 V336" marker-end="url(#ah)"/>
  <text class="lb" x="668" y="313">단계 기록</text>
  <!-- messages.create -->
  <path class="ln" d="M990,280 V496" marker-end="url(#ah)"/>
  <rect class="lbg" x="933" y="432" width="115" height="16"/><text class="lb" x="990" y="445" text-anchor="middle">messages.create</text>
  <!-- create_run (선택) -->
  <path class="ln" d="M660,400 V496" marker-end="url(#ah)"/>
  <rect class="lbg" x="598" y="432" width="125" height="16"/><text class="lb" x="660" y="445" text-anchor="middle">create_run (선택)</text>
  <!-- 검색 모듈 → documents · 로컬 파일 -->
  <path class="ln" d="M200,265 H180 V600 H600 V656" marker-end="url(#ah)"/>
  <path class="ln" d="M330,600 V656" marker-end="url(#ah)"/>
  <rect class="lbg" x="196" y="592" width="119" height="16"/><text class="lb" x="255" y="605" text-anchor="middle">PDF 지문 · 페이지</text>
  <rect class="lbg" x="400" y="592" width="131" height="16"/><text class="lb" x="465" y="605" text-anchor="middle">벡터 검색 · E5 모델</text>
  <!-- 명령줄 도구 → documents · 로컬 파일 -->
  <path class="ln" d="M1120,110 H1150 V760 H330 V738" marker-end="url(#ah)"/>
  <path class="ln" d="M660,760 V738" marker-end="url(#ah)"/>
  <rect class="lbg" x="464" y="752" width="62" height="16"/><text class="lb" x="495" y="765" text-anchor="middle">PDF 추출</text>
  <rect class="lbg" x="822" y="752" width="167" height="16"/><text class="lb" x="905" y="765" text-anchor="middle">인덱스 · 번들 · 평가 결과</text>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <rect x="170" y="790" width="14" height="14" rx="3" fill="#1E3A5F"/><text x="190" y="802">답변을 만드는 코드</text>
    <rect x="330" y="790" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#94A3B8"/><text x="350" y="802">화면 · 도구 · 추적</text>
    <rect x="490" y="790" width="14" height="14" rx="3" fill="#F1F5F9" stroke="#94A3B8"/><text x="510" y="802">외부 서비스 · 파일</text>
    <path d="M650,797 H684" stroke="#64748B" stroke-width="1.4"/><text x="692" y="802">호출 · 데이터</text>
    <path d="M800,797 H834" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/><text x="842" y="802">표시용 참조</text>
  </g>
</svg>
